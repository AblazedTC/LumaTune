name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: win-msvc-release
          - os: macos-14 # arm64 runner
            preset: mac-arm64-release
          - os: macos-13 # x86_64 runner
            preset: mac-x64-release
          - os: ubuntu-latest
            preset: linux-gcc-release

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install OpenCL runtime (Linux, so haveOpenCL() can report true)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

      - name: Set up MSVC dev prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Check src/core stays Qt-free
        shell: bash
        run: python tools/check_includes.py

      - name: Run OpenCL probe (PLAN.md P0.4)
        shell: bash
        run: |
          probe="build/${{ matrix.preset }}/opencl_probe"
          [ -f "${probe}.exe" ] && probe="${probe}.exe"
          "${probe}"
