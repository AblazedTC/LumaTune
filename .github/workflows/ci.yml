name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: win-msvc-release
          - os: macos-15 # arm64 runner
            preset: mac-arm64-release
          # mac-x64-release (macos-*-large) needs a billed "larger runner" -
          # GitHub no longer has a free x64 macOS hosted image. Dropped
          # until billing is sorted or a self-hosted runner is added
          # (PLAN.md risk register R-12). Build/verify x64 Mac locally
          # until then.
          - os: ubuntu-latest
            preset: linux-gcc-release

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install OpenCL runtime (Linux, so haveOpenCL() can report true)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

      # Some of vcpkg's transitive dependencies still build via autotools
      # and need these from the system package manager (not vcpkg-
      # installable) - e.g. libb2 (pulled in on Linux, likely a vcpkg/
      # onnxruntime tooling dep, not something our own manifest names
      # directly). libexif used to be the reason for this step; it's gone
      # (ADR-0007), but other autotools-based transitive deps remain, so
      # this step stays as a general "autotools deps are missing" fix
      # rather than being re-added package-by-package as CI finds each one.
      - name: Install autotools build deps for vcpkg's autotools-based ports (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Install autotools build deps for vcpkg's autotools-based ports (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf autoconf-archive automake libtool

      # Apple Clang ships no omp.h/libomp, so libraw[openmp] (vcpkg) fails
      # to even configure without this. OpenMP_ROOT is how CMake's
      # find_package(OpenMP) locates a non-system libomp on Apple Clang.
      - name: Install libomp for libraw's openmp feature (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Set up MSVC dev prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      # Reuse already-built vcpkg packages (OpenCV etc.) across CI runs via
      # the GitHub Actions cache, instead of rebuilding them from source
      # every push. https://learn.microsoft.com/vcpkg/consume/binary-caching-github-actions-cache
      - name: Export GHA cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable vcpkg binary caching
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Check src/core stays Qt-free
        shell: bash
        run: python tools/check_includes.py

      - name: Run OpenCL probe (PLAN.md P0.4)
        shell: bash
        run: |
          probe="build/${{ matrix.preset }}/opencl_probe"
          [ -f "${probe}.exe" ] && probe="${probe}.exe"
          "${probe}"

  luma-py:
    name: luma_py (Linux, LUMA_BUILD_PY=ON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      # Must match vcpkg's bundled python3 port's MAJOR.MINOR (currently
      # 3.14.x) exactly, not just satisfy pyproject.toml's >=3.10 floor:
      # vcpkg's python3 port wraps find_package(Python ...) and always
      # substitutes its OWN headers/libs for Development components
      # (bindings/python/CMakeLists.txt's comment has the full story), so
      # luma_py is built against vcpkg's Python ABI regardless of which
      # interpreter actually runs this job - this must be the same minor
      # version, or the built module won't import into it afterwards.
      - name: Set up Python (matching vcpkg's bundled python3 port)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install OpenCL runtime
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

      - name: Install autotools build deps for vcpkg's autotools-based ports
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Export GHA cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable vcpkg binary caching
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      # PLAN.md P1.8: verifies bindings/python/ compiles and links against
      # nanobind/Python via the normal CMake/vcpkg flow this repo already
      # relies on everywhere else - the pip-installable packaging path
      # (pyproject.toml/scikit-build-core) is a separate, exploratory
      # configuration with its own job (luma-py-pip) below.
      - name: Configure (LUMA_BUILD_PY=ON)
        run: cmake --preset linux-gcc-release -DLUMA_BUILD_PY=ON -DLUMA_BUILD_BENCH=OFF

      - name: Build luma_py
        run: cmake --build --preset linux-gcc-release --target luma_py

  luma-py-pip:
    name: luma_py pip install + T-5 parity (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      # Must match vcpkg's bundled python3 port's MAJOR.MINOR (currently
      # 3.14.x) exactly, not just satisfy pyproject.toml's >=3.10 floor:
      # vcpkg's python3 port wraps find_package(Python ...) and always
      # substitutes its OWN headers/libs for Development components
      # (bindings/python/CMakeLists.txt's comment has the full story), so
      # luma_py is built against vcpkg's Python ABI regardless of which
      # interpreter actually runs this job - this must be the same minor
      # version, or the built module won't import into it afterwards.
      - name: Set up Python (matching vcpkg's bundled python3 port)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install OpenCL runtime
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

      - name: Install autotools build deps for vcpkg's autotools-based ports
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"
          # bindings/python/pyproject.toml's own cmake.define table has no
          # documented env-var templating to derive this from VCPKG_ROOT
          # itself, so it's set directly here instead - CMake already
          # honours this exact env var as a toolchain default.
          echo "CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      - name: Export GHA cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable vcpkg binary caching
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      # PLAN.md P1.8/T-5: the pip-installable packaging path (scikit-
      # build-core, bindings/python/pyproject.toml), separate from (and
      # exploratory relative to) the plain-CMake luma-py job above.
      - name: pip install -e bindings/python
        run: python -m pip install -e bindings/python -v

      - name: Install parity test dependencies
        run: python -m pip install -r tests/parity/requirements.txt

      - name: Run T-5 parity suite
        run: pytest tests/parity -v

  luma-ui:
    # P2.1 chunk 1: first-ever Qt install in this repo's CI. Its own
    # isolated, Linux-only job (same reasoning as luma-py above) so a
    # toolchain failure here can't block the stable core build matrix
    # while LUMA_BUILD_UI defaults OFF. Windows/macOS verification is a
    # follow-up once this is proven (PLAN.md P2.1 row).
    name: lumatune (Linux, LUMA_BUILD_UI=ON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      # Qt runtime/dev packages Qt itself doesn't ship (AGENTS.md §3 Linux
      # prerequisites).
      - name: Install Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 \
            libfontconfig1-dev libfreetype6-dev libwayland-dev

      # AGENTS.md §3: pinned 6.11.x, installed via aqtinstall (this action
      # wraps it) rather than vcpkg. Sets Qt6_DIR for the Configure step
      # below.
      - name: Install Qt (AGENTS.md-pinned 6.11.x)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          modules: "qtshadertools qtimageformats"

      - name: Install OpenCL runtime
        run: sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

      - name: Install autotools build deps for vcpkg's autotools-based ports
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Export GHA cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable vcpkg binary caching
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      - name: Configure (LUMA_BUILD_UI=ON)
        run: cmake --preset linux-gcc-release -DLUMA_BUILD_UI=ON -DLUMA_BUILD_BENCH=OFF

      - name: Build lumatune
        run: cmake --build --preset linux-gcc-release --target lumatune

      # P2.2 chunk 1 (ImageDocument/PipelineController): builds + runs
      # alongside lumatune in this same isolated job, same reasoning as
      # the Configure step above - no separate job needed just for T-6.
      - name: Build and run ui tests (T-6)
        run: |
          cmake --build --preset linux-gcc-release --target luma_ui_image_document_test luma_ui_pipeline_controller_test luma_ui_preview_item_test luma_ui_diagnostics_model_test
          ctest --preset linux-gcc-release -L ui --output-on-failure

      - name: Check --version exits 0 (PLAN.md P2.1 acceptance)
        run: ./build/linux-gcc-release/src/app/lumatune --version

      # PLAN.md P2.1 acceptance: "launches and shows an empty window" -
      # QT_QPA_PLATFORM=offscreen lets this run on a headless CI runner
      # (AGENTS.md §4's documented pattern for the `ui` ctest label).
      - name: Smoke-test launch (offscreen)
        run: |
          QT_QPA_PLATFORM=offscreen ./build/linux-gcc-release/src/app/lumatune > lumatune_smoke.log 2>&1 &
          pid=$!
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "lumatune exited before the smoke test finished"
            cat lumatune_smoke.log
            exit 1
          fi
          if grep -Ei "qml:.*(error|warning)|qrc:.*(error|warning)" lumatune_smoke.log; then
            echo "lumatune printed a QML error/warning during the smoke test"
            cat lumatune_smoke.log
            exit 1
          fi
          kill "$pid"
          # bash's `run:` shell has set -e on; `wait` returning 143 (SIGTERM,
          # the expected outcome of the kill above) would otherwise abort
          # the script here before the status check below ever runs.
          status=0
          wait "$pid" 2>/dev/null || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 143 ]; then
            echo "lumatune exited abnormally after the smoke test (status $status)"
            cat lumatune_smoke.log
            exit 1
          fi

      # P2.7/T-10: "opens fixture, runs pipeline, exports, exits 0" - no
      # QT_QPA_PLATFORM needed here at all (unlike the smoke test above),
      # since --self-test's QCoreApplication path never touches a QPA
      # platform plugin.
      - name: Check --self-test exits 0 (PLAN.md P2.7/T-10)
        run: ./build/linux-gcc-release/src/app/lumatune --self-test tests/golden/fixtures/warm_cast.jpg

      # P2.8 (PLAN.md §12's Linux row): unsigned AppImage + tarball.
      # AppImage signing is P7.1's job, later.
      - name: Package (AppImage + tarball)
        run: packaging/linux/package.sh build/linux-gcc-release build/linux-gcc-release/packaging-out

      # P2.8 acceptance: "T-10 green from the bundle", not just the raw
      # build output above - extract rather than mount (no FUSE on this
      # runner, same reasoning as package.sh's APPIMAGE_EXTRACT_AND_RUN).
      - name: Verify T-10 against the packaged AppImage
        run: |
          cd build/linux-gcc-release/packaging-out
          ./LumaTune-0.1.0-x86_64.AppImage --appimage-extract
          ./squashfs-root/AppRun --self-test "$GITHUB_WORKSPACE/tests/golden/fixtures/warm_cast.jpg"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: lumatune-linux-x86_64
          path: |
            build/linux-gcc-release/packaging-out/*.AppImage
            build/linux-gcc-release/packaging-out/*.tar.gz
          retention-days: 7

  luma-ui-windows:
    # P2.8 chunk 2/3: this repo's first-ever Windows LUMA_BUILD_UI=ON CI
    # job (P2.1's own noted follow-up - only Linux has had one so far).
    # Mirrors luma-ui's structure; shell: bash is explicit throughout so
    # the exact same POSIX smoke-test/self-test script bodies work
    # unchanged (Windows runners ship Git Bash).
    name: lumatune (Windows, LUMA_BUILD_UI=ON)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set up MSVC dev prompt
        uses: ilammy/msvc-dev-cmd@v1

      # 6.10.0, not AGENTS.md's pinned 6.11.x: aqtinstall 3.3.0 cannot
      # install ANY 6.11.x (.0/.1/.2/.3, all reproduced locally) on
      # Windows - it requests
      # "windows_x86/desktop/qt6_6112/qt6_6112/Updates.xml", which is a
      # 404 even against download.qt.io directly (the real folder is
      # "qt6_6112/qt6_6112_msvc2022_64/..."); 6.10.0 installs cleanly
      # with the exact same command. Linux/macOS aren't affected (their
      # repository layout differs) and stay on 6.11.2 - this pin is
      # Windows-CI-only, a workaround for this upstream aqtinstall bug,
      # not a project-wide Qt downgrade. Revisit once aqtinstall ships
      # a fix for the 6.11.x line on Windows.
      - name: Install Qt (6.10.0 - see comment above, not AGENTS.md's 6.11.x pin)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          modules: "qtshadertools qtimageformats"

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Export GHA cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable vcpkg binary caching
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      # LUMA_QT_VERSION=6.10.0 matches the Qt actually installed above
      # (cmake/Qt.cmake's own comment explains why) - find_package would
      # otherwise reject it as "not compatible" with the real 6.11.x pin.
      # Quoted, unlike the other -D flags: pwsh (the default shell here)
      # mis-tokenizes a bare "-DFOO=6.10.0" into "-DFOO=6" and ".10.0"
      # as two separate arguments - it tries to parse the dotted value
      # as a numeric literal and splits where that parse gives up.
      # Verified both the bug and the quoted fix directly in pwsh before
      # pushing (`'-DLUMA_QT_VERSION=6.10.0'` tokenizes as one argument,
      # a bare one doesn't).
      - name: Configure (LUMA_BUILD_UI=ON)
        run: cmake --preset win-msvc-release -DLUMA_BUILD_UI=ON -DLUMA_BUILD_BENCH=OFF '-DLUMA_QT_VERSION=6.10.0'

      - name: Build lumatune
        run: cmake --build --preset win-msvc-release --target lumatune

      - name: Build and run ui tests (T-6)
        shell: bash
        run: |
          cmake --build --preset win-msvc-release --target luma_ui_image_document_test luma_ui_pipeline_controller_test luma_ui_preview_item_test luma_ui_diagnostics_model_test
          ctest --preset win-msvc-release -L ui --output-on-failure

      - name: Check --version exits 0 (PLAN.md P2.1 acceptance)
        shell: bash
        run: ./build/win-msvc-release/src/app/lumatune.exe --version

      - name: Smoke-test launch (offscreen)
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen ./build/win-msvc-release/src/app/lumatune.exe > lumatune_smoke.log 2>&1 &
          pid=$!
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "lumatune exited before the smoke test finished"
            cat lumatune_smoke.log
            exit 1
          fi
          if grep -Ei "qml:.*(error|warning)|qrc:.*(error|warning)" lumatune_smoke.log; then
            echo "lumatune printed a QML error/warning during the smoke test"
            cat lumatune_smoke.log
            exit 1
          fi
          kill "$pid"
          status=0
          wait "$pid" 2>/dev/null || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 143 ]; then
            echo "lumatune exited abnormally after the smoke test (status $status)"
            cat lumatune_smoke.log
            exit 1
          fi

      - name: Check --self-test exits 0 (PLAN.md P2.7/T-10)
        shell: bash
        run: ./build/win-msvc-release/src/app/lumatune.exe --self-test tests/golden/fixtures/warm_cast.jpg

      # P2.8 (PLAN.md §12's Windows row): unsigned portable zip via
      # windeployqt. The Inno Setup/WiX installer is a deferred
      # follow-up, not part of this chunk - see packaging/windows/package.ps1.
      # Authenticode signing is P7.1's job, later.
      - name: Package (windeployqt + zip)
        shell: pwsh
        run: packaging\windows\package.ps1 -BuildDir build\win-msvc-release -OutDir build\win-msvc-release\packaging-out

      # P2.8 acceptance: "T-10 green from the bundle", not just the raw
      # build output above.
      - name: Verify T-10 against the packaged zip
        shell: pwsh
        run: |
          Expand-Archive -Path build\win-msvc-release\packaging-out\LumaTune-0.1.0-win64.zip -DestinationPath build\win-msvc-release\packaging-out\extracted
          & build\win-msvc-release\packaging-out\extracted\lumatune.exe --self-test tests\golden\fixtures\warm_cast.jpg
          if ($LASTEXITCODE -ne 0) { throw "self-test failed against packaged zip (exit $LASTEXITCODE)" }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: lumatune-windows-x64
          path: build/win-msvc-release/packaging-out/*.zip
          retention-days: 7

  luma-ui-macos:
    # P2.8 chunk 3/3: this repo's first-ever macOS LUMA_BUILD_UI=ON CI
    # job (P2.1's own noted follow-up). Mirrors luma-ui's structure,
    # plus the macOS-only vcpkg/libomp setup steps the main `build`
    # job's macos-15 matrix entry already needed. Unlike Windows,
    # 6.11.2 installs cleanly here - checked the macOS Qt repository
    # layout directly before writing this job: mac_x64/desktop's
    # combined qt6_6112/qt6_6112/Updates.xml exists (unlike Windows's
    # equivalent, which 404s - the actual root cause of that whole
    # debugging chain), so aqtinstall's lookup path works unmodified.
    name: lumatune (macOS, LUMA_BUILD_UI=ON)
    runs-on: macos-15 # arm64 runner, same as the main build job's matrix entry
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install Qt (AGENTS.md-pinned 6.11.x)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          modules: "qtshadertools qtimageformats"

      - name: Install autotools build deps for vcpkg's autotools-based ports
        run: brew install autoconf autoconf-archive automake libtool

      # Apple Clang ships no omp.h/libomp, so libraw[openmp] (vcpkg)
      # fails to even configure without this (same as the main build
      # job's macOS matrix entry).
      - name: Install libomp for libraw's openmp feature
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Export GHA cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable vcpkg binary caching
        run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      - name: Configure (LUMA_BUILD_UI=ON)
        run: cmake --preset mac-arm64-release -DLUMA_BUILD_UI=ON -DLUMA_BUILD_BENCH=OFF

      - name: Build lumatune
        run: cmake --build --preset mac-arm64-release --target lumatune

      - name: Build and run ui tests (T-6)
        run: |
          cmake --build --preset mac-arm64-release --target luma_ui_image_document_test luma_ui_pipeline_controller_test luma_ui_preview_item_test luma_ui_diagnostics_model_test
          ctest --preset mac-arm64-release -L ui --output-on-failure

      - name: Check --version exits 0 (PLAN.md P2.1 acceptance)
        run: ./build/mac-arm64-release/src/app/lumatune.app/Contents/MacOS/lumatune --version

      - name: Smoke-test launch (offscreen)
        run: |
          QT_QPA_PLATFORM=offscreen ./build/mac-arm64-release/src/app/lumatune.app/Contents/MacOS/lumatune > lumatune_smoke.log 2>&1 &
          pid=$!
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "lumatune exited before the smoke test finished"
            cat lumatune_smoke.log
            exit 1
          fi
          if grep -Ei "qml:.*(error|warning)|qrc:.*(error|warning)" lumatune_smoke.log; then
            echo "lumatune printed a QML error/warning during the smoke test"
            cat lumatune_smoke.log
            exit 1
          fi
          kill "$pid"
          status=0
          wait "$pid" 2>/dev/null || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 143 ]; then
            echo "lumatune exited abnormally after the smoke test (status $status)"
            cat lumatune_smoke.log
            exit 1
          fi

      - name: Check --self-test exits 0 (PLAN.md P2.7/T-10)
        run: ./build/mac-arm64-release/src/app/lumatune.app/Contents/MacOS/lumatune --self-test tests/golden/fixtures/warm_cast.jpg

      # P2.8 (PLAN.md §12's macOS row): unsigned dmg via macdeployqt.
      # Developer ID signing/notarization is P7.1's job, later.
      - name: Package (macdeployqt + dmg)
        run: packaging/macos/package.sh build/mac-arm64-release build/mac-arm64-release/packaging-out

      # P2.8 acceptance: "T-10 green from the bundle" - macdeployqt
      # modifies the .app bundle in place to be self-contained before
      # wrapping it in the dmg, so re-running --self-test against that
      # same bundle (rather than mounting the dmg just to re-extract
      # the identical bundle from it) verifies the exact thing that
      # ships inside the dmg.
      - name: Verify T-10 against the packaged app bundle
        run: ./build/mac-arm64-release/src/app/lumatune.app/Contents/MacOS/lumatune --self-test tests/golden/fixtures/warm_cast.jpg

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: lumatune-macos-arm64
          path: build/mac-arm64-release/packaging-out/*.dmg
          retention-days: 7
