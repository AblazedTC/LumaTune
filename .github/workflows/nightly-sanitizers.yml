name: nightly-sanitizers

# T-9 (PLAN.md §11): sanitizer coverage, deliberately not part of the
# PR-blocking ci.yml (T-9 is specced as "Nightly", not per-push - a from-
# scratch ASan/TSan vcpkg build is a different triplet/compiler/build-type
# combo than ci.yml's release builds, so it can't reuse their binary
# cache and takes much longer).
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-asan, linux-clang-tsan]

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install OpenCL runtime (so haveOpenCL() can report true)
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

      - name: Install autotools build deps for vcpkg's autotools-based ports
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Export GHA cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable vcpkg binary caching
        shell: bash
        run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests (sanitized)
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure
